name: Update thumbnail index

on:
  push:
    branches: [main]
    paths:
      - 'assets/thumbnails/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: thumbnail-index-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate index from image files
        run: node scripts/generate-thumbnail-index.js
      - name: Commit only when the index changed
        id: commit
        run: |
          if git diff --quiet -- data/thumbnail-index.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thumbnail-index.json
          git commit -m 'Update thumbnail index'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Request Pages build for the generated index
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
