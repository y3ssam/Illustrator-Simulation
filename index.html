<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어쩌구 키우기 · 작업실</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="reference.css?v=work-panel-height-1"></head>
<body><div class="shell">
<div class="game-frame"><div class="window-bar" id="topbar"><span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span><strong id="bar-name">나의 작업실</strong><section id="metrics" class="metrics" aria-label="작업실 현황"></section><button id="settings-open" aria-label="설정과 저장">⚙</button></div>
<nav aria-label="작업실 메뉴"><button data-tab="studio" aria-pressed="true"><span class="nav-icon"></span><span>작업실</span></button><button data-tab="home" aria-pressed="false"><span class="nav-icon"></span><span>집</span></button><button data-tab="shop" aria-pressed="false"><span class="nav-icon"></span><span>상점</span></button><button data-tab="gacha" aria-pressed="false"><span class="nav-icon"></span><span>가챠</span></button><button data-tab="journal" aria-pressed="false"><span class="nav-icon"></span><span>기록</span></button><span id="save-status" class="save-dot" title="저장 상태">자동 저장 준비 중</span></nav>
<main id="view"></main><aside id="growth-note" class="note-drawer" aria-label="성장 노트" hidden></aside></div>
</div>
<div id="note-backdrop" class="note-backdrop" hidden></div>
<aside class="notification-stack" aria-label="작업실 알림"><div id="storage-note" class="notice" hidden></div><div id="return-report" hidden></div></aside>
<div class="toast" id="toast" role="status" aria-live="polite" popover="manual" hidden></div>
<dialog id="settings"><form method="dialog"><div class="row between"><h2>작업실 설정</h2><button value="close" aria-label="설정 닫기">닫기</button></div></form>
<div id="readonly-setting" class="hint" hidden><p>다른 창에서 운영 중이어서 이 창은 보기 전용입니다.</p><button id="settings-takeover">이 창에서 이어하기</button></div>
<label>작업실 주인 이름 <input id="name" maxlength="40"></label><button id="rename">이름 저장</button>
<hr><h3>저장 데이터</h3><p class="muted">이 버전의 저장과 원본 게임에서 내보낸 JSON을 불러올 수 있어요. 원본 브라우저 저장은 건드리지 않습니다.</p>
<div class="row"><button id="export">저장 내보내기</button><button id="import">저장 불러오기</button></div><input id="import-file" type="file" accept=".json,.txt" hidden>
<hr><details><summary>새로 시작</summary><p>이 버전의 진행을 지웁니다. 먼저 저장을 내보내두세요.</p><label>확인하려면 ‘새로 시작’을 입력 <input id="reset-confirm" autocomplete="off"></label><button id="reset">이 버전 새로 시작</button></details>
</dialog>
<dialog id="inbox-sheet" aria-label="도착함"><form method="dialog" class="sheet-heading"><h2>도착함</h2><button aria-label="도착함 닫기">×</button></form><div id="inbox-sheet-content"></div></dialog>
<dialog id="welcome" aria-labelledby="welcome-title"><form id="welcome-form"><span class="eyebrow">YOUR FIRST STUDIO</span><h2 id="welcome-title">작업실 주인을 소개해주세요</h2><p class="muted">낙서 두상·흉상부터 시작해요. 의뢰를 기다리는 동안 그림 연습으로 성장할 수 있어요.</p><label>이름 <input id="welcome-name" maxlength="40" required autocomplete="off" placeholder="어떤 이름으로 활동할까요?"></label><p id="welcome-error" role="status" class="risk"></p><button type="button" id="welcome-takeover" hidden>이 창에서 이어하기</button><button type="submit" class="primary" id="welcome-start">작업실 열기</button><button type="button" id="welcome-import">기존 저장 불러오기</button></form></dialog>
<script src="catalog.js"></script><script src="engine.js?v=shop-journal-1"></script><script src="app.js?v=work-panel-height-1"></script></body></html>
